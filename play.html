 <!DOCTYPE html>
<html>
<head>
  <title>Continue to Minecraft</title>
  <style>
    #continueBtn {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #continueBtn:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>
  <h2>Ready to play Minecraft?</h2>
  <button id="continueBtn">Continue</button>

  <script>
    document.getElementById("continueBtn").onclick = function() {
      window.location.href = "https://classic.minecraft.net/"; // You can replace this URL
    };
  </script>
</body>
</html>
