<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Minecraft World</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: #57A773; /* Grass-like color */
            color: #333;
        }
        header {
            background: #2C5F2D; /* Dark green for a Minecraft feel */
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: #4CAF50;
        }
        nav a {
            text-decoration: none;
            color: white;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #2C5F2D;
        }
        p {
            font-size: 1.2em;
            line-height: 1.5;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            background: #2C5F2D;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
        .button:hover {
            background: #1E4620;
        }
        footer {
            text-align: center;
            padding: 10px;
            background: #2C5F2D;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Minecraft World</h1>
    </header>
    <nav>
        <a href="#about">About</a>
        <a href="#download">Download</a>
        <a href="#contact">Contact</a>
    </nav>
    <main>
        <h1>Explore, Build, Survive!</h1>
        <p>Welcome to the ultimate Minecraft fan website. Whether you're a builder, miner, or adventurer, this is your hub for all things Minecraft.</p>
        <a href="#download" class="button">Get Started</a>
    </main>
    <footer>
        &copy; 2025 Minecraft World. All rights reserved.
    </footer>
</body>
</html>
